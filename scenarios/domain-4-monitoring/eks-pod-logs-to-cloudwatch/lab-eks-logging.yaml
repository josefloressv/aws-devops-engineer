AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Adds the container-log forwarding path to the cluster created by
  scenarios/domain-4-monitoring/eks-crashloop-log-retrieval. Installs the
  amazon-cloudwatch-observability EKS add-on (CloudWatch agent + Fluent Bit
  DaemonSets) and grants the existing worker node role the CloudWatch write
  permissions those agents need. Deliberately a SEPARATE stack from the cluster:
  the cluster stack's "no log forwarding configured" state is the control
  condition, and deleting this stack removes the forwarding path without
  touching the cluster.

Parameters:
  EksStackName:
    Type: String
    Default: dop-c02-lab-eks
    Description: >-
      Name of the stack that owns the EKS cluster. Used to build the
      Fn::ImportValue export names (<stack>-ClusterName, <stack>-NodeRoleArn).

  AddonVersion:
    Type: String
    Default: v6.4.0-eksbuild.1
    Description: >-
      Version of the amazon-cloudwatch-observability add-on. Must be compatible
      with the cluster's Kubernetes version; list the options with
      `aws eks describe-addon-versions --addon-name amazon-cloudwatch-observability
      --kubernetes-version <ver>`.

  LogRetentionDays:
    Type: Number
    Default: 1
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: >-
      Retention to apply to the log groups Fluent Bit creates. NOTE: this is not
      applied by this stack -- see the SetLogRetentionCommand output. The add-on
      creates its log groups at runtime, outside CloudFormation, and creates them
      with retention "Never expire". Declaring them as stack resources here would
      make them stack-owned, which would both change what the teardown test
      measures and block a later re-deploy of this stack.

Resources:
  # --- Permissions for the node-level agents --------------------------------
  # The CloudWatch agent and Fluent Bit run as DaemonSets and, with no IRSA or
  # Pod Identity association configured, authenticate as the EC2 instance role of
  # the node they run on. That role belongs to the cluster stack, and a role
  # cannot have ManagedPolicyArns appended to it from a second stack -- so this
  # is a customer managed policy that attaches itself to the imported role via
  # its own Roles property, instead of attaching AWS's CloudWatchAgentServerPolicy.
  CloudWatchAgentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-cloudwatch-agent"
      Description: >-
        CloudWatch write permissions for the amazon-cloudwatch-observability
        add-on's node agents.
      # The cluster stack exports the role ARN but not its name; derive the name
      # by splitting the ARN on "/" (arn:aws:iam::<acct>:role/<name>).
      Roles:
        - !Select
          - 1
          - !Split
            - "/"
            - Fn::ImportValue: !Sub "${EksStackName}-NodeRoleArn"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Fluent Bit creates the log group and stream on first event, then
          # writes container stdout/stderr into it.
          - Sid: ContainerLogForwarding
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogStreams
              - logs:DescribeLogGroups
              - logs:PutRetentionPolicy
            Resource: "*"
          # Container Insights metrics published by the CloudWatch agent.
          - Sid: ContainerInsightsMetrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
          # The agent tags metrics with node/volume metadata it reads from EC2.
          - Sid: NodeMetadata
            Effect: Allow
            Action:
              - ec2:DescribeVolumes
              - ec2:DescribeTags
            Resource: "*"
          # The agent reads its configuration document from Parameter Store.
          - Sid: AgentConfigFromSsm
            Effect: Allow
            Action: ssm:GetParameter
            Resource: "*"

  # --- The forwarding path itself -------------------------------------------
  # Installs three workloads into the amazon-cloudwatch namespace:
  #   cloudwatch-agent          DaemonSet   (Container Insights metrics)
  #   fluent-bit                DaemonSet   (container stdout/stderr -> CW Logs)
  #   amazon-cloudwatch-observability-controller-manager  Deployment
  # Needs 3 free pod slots on the node; see the README's capacity note.
  CloudWatchObservabilityAddon:
    Type: AWS::EKS::Addon
    # Attach the policy before the agents start, so they do not spend their
    # first minutes crash-looping on AccessDenied.
    DependsOn: CloudWatchAgentPolicy
    Properties:
      AddonName: amazon-cloudwatch-observability
      AddonVersion: !Ref AddonVersion
      ClusterName:
        Fn::ImportValue: !Sub "${EksStackName}-ClusterName"
      ResolveConflicts: OVERWRITE
      # ConfigurationValues is left unset, so the add-on installs with its
      # defaults (containerLogs enabled, Container Insights enabled). Note that
      # the Fluent Bit DaemonSet ships with READ_FROM_HEAD=Off, i.e. newly
      # discovered log files are read from their end -- this was checked against
      # this workload and the crash lines are still captured, so no override of
      # application-log.conf is needed. The Container Insights metric stream is
      # the main cost line here -- see the README. `aws eks
      # describe-addon-configuration --addon-name
      # amazon-cloudwatch-observability --addon-version <ver>` prints the schema
      # if the defaults ever need trimming.

Outputs:
  ApplicationLogGroup:
    Description: >-
      Log group Fluent Bit writes container stdout/stderr into. Created by the
      agent on first event, not by this stack.
    Value:
      Fn::Sub:
        - "/aws/containerinsights/${ClusterName}/application"
        - ClusterName:
            Fn::ImportValue: !Sub "${EksStackName}-ClusterName"

  SetLogRetentionCommand:
    Description: >-
      Run after the log groups appear, to stop an abandoned cluster accumulating
      log storage indefinitely. Fluent Bit creates its groups with no expiry.
    Value:
      Fn::Sub:
        - >-
          for g in application dataplane host performance; do aws logs
          put-retention-policy --log-group-name
          /aws/containerinsights/${ClusterName}/$g --retention-in-days
          ${LogRetentionDays}; done
        - ClusterName:
            Fn::ImportValue: !Sub "${EksStackName}-ClusterName"
          LogRetentionDays: !Ref LogRetentionDays

  AddonPodsCommand:
    Description: Copy/paste to watch the add-on's pods reach Running.
    Value: kubectl get pods -n amazon-cloudwatch
